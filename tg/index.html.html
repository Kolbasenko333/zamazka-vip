<style>
:root{
    --lime:#c8ff00;
    --lime2:#00ffaa;
    --bg:#050805;
    --glass:rgba(255,255,255,0.04);
    --border:rgba(200,255,0,0.22);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
    width:100%;min-height:100vh;
    background:var(--bg);
    color:#fff;
    font-family:'Unbounded',sans-serif;
    overflow-x:hidden;
    text-align:center;
}

/* ── BACKGROUNDS ── */
.bg-chips{position:fixed;inset:0;background:url('ФИШКИ .png') center/cover no-repeat;opacity:.28;z-index:0;pointer-events:none;}
.bg-smoke{position:fixed;inset:0;background:url('green-smoke-spread-black-background.jpg') center/cover no-repeat;opacity:.7;mix-blend-mode:screen;z-index:1;pointer-events:none;animation:smokePulse 18s ease-in-out infinite;}
.bg-vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 20%,rgba(0,0,0,.75) 100%);}
@keyframes smokePulse{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.06);opacity:.85}}

/* ── PARTICLES ── */
#pts{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;}
.pt{position:absolute;border-radius:50%;background:var(--lime);opacity:0;animation:ptRise linear infinite;}
@keyframes ptRise{0%{transform:translateY(110vh) scale(0);opacity:0}8%{opacity:.5}92%{opacity:.2}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* ── PAGE ── */
.page{position:relative;z-index:10;max-width:430px;margin:0 auto;padding:0 22px 60px;display:flex;flex-direction:column;align-items:center;}

/* ── BRAND ── */
.brand{width:100%;padding:28px 0 14px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.brand-name{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(2.8rem,12vw,3.6rem);
    letter-spacing:7px;color:var(--lime);
    text-shadow:0 0 30px rgba(200,255,0,.55),0 0 60px rgba(200,255,0,.25);
    line-height:1;
    animation:glowPulse 3s ease-in-out infinite;
}
.brand-sub{font-size:clamp(.42rem,2.5vw,.58rem);letter-spacing:5px;font-weight:700;color:rgba(255,255,255,.32);text-transform:uppercase;}
@keyframes glowPulse{0%,100%{text-shadow:0 0 25px rgba(200,255,0,.5),0 0 50px rgba(200,255,0,.2)}50%{text-shadow:0 0 45px rgba(200,255,0,.85),0 0 90px rgba(200,255,0,.45)}}

.line{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:14px 0;}
.union-tag{font-size:clamp(.42rem,2.3vw,.55rem);font-weight:700;letter-spacing:5px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:20px;}

/* ── POLL CARD ── */
.poll-card{
    width:100%;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:26px;
    padding:28px 20px 26px;
    backdrop-filter:blur(18px);
    margin-bottom:18px;
    animation:fadeSlide .6s cubic-bezier(.4,0,.2,1) both;
}
@keyframes fadeSlide{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

.poll-step{font-size:.48rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--lime);opacity:.7;margin-bottom:10px;}
.poll-q{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.5rem,7.5vw,2rem);letter-spacing:2px;color:#fff;margin-bottom:22px;line-height:1.15;}

.poll-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}

.dev-btn{
    position:relative;overflow:hidden;
    background:rgba(255,255,255,.04);
    border:1.5px solid rgba(255,255,255,.11);
    border-radius:20px;
    padding:26px 10px 22px;
    cursor:pointer;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;align-items:center;gap:13px;
    outline:none;-webkit-appearance:none;
}
.dev-btn:hover{border-color:rgba(200,255,0,.35);transform:translateY(-2px);}
.dev-btn.sel{
    border-color:var(--lime);
    background:rgba(200,255,0,.07);
    animation:ringPop .5s ease-out forwards;
}
.dev-btn.sel .dev-icon-wrap{background:rgba(200,255,0,.15);}
.dev-btn.sel .dev-label{color:var(--lime);}
@keyframes ringPop{0%{box-shadow:0 0 0 0 rgba(200,255,0,.6)}60%{box-shadow:0 0 0 14px rgba(200,255,0,0)}100%{box-shadow:0 0 30px rgba(200,255,0,.2)}}

.dev-icon-wrap{
    width:58px;height:58px;border-radius:16px;
    background:rgba(255,255,255,.07);
    display:flex;align-items:center;justify-content:center;
    transition:background .3s;
}
.dev-icon-wrap svg{display:block;}

.dev-label{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:3px;color:rgba(255,255,255,.7);transition:color .3s;}

/* ── CTA ── */
.cta-wrap{width:100%;max-height:0;overflow:hidden;opacity:0;transition:max-height .7s cubic-bezier(.4,0,.2,1),opacity .5s .1s ease,transform .5s ease;transform:translateY(16px);}
.cta-wrap.show{max-height:260px;opacity:1;transform:translateY(0);}
.cta-inner{padding:4px 0 26px;}
.cta-hint{font-size:.44rem;letter-spacing:3px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:14px;}

.tg-btn{
    display:flex;align-items:center;justify-content:center;gap:13px;
    width:100%;padding:20px 20px;
    border-radius:50px;
    background:linear-gradient(90deg,var(--lime),var(--lime2),var(--lime));
    background-size:200% auto;
    animation:gradMove 3s linear infinite;
    color:#000;text-decoration:none;
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(.95rem,5vw,1.2rem);
    letter-spacing:2px;
    box-shadow:0 0 18px rgba(200,255,0,.35),0 4px 12px rgba(0,0,0,.4);
    position:relative;overflow:hidden;
    transition:transform .2s,box-shadow .2s;
    -webkit-appearance:none;
}
.tg-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-100%);animation:shimmer 2.4s ease infinite;}
@keyframes gradMove{0%{background-position:0 center}100%{background-position:200% center}}
@keyframes shimmer{0%{transform:translateX(-100%)}55%,100%{transform:translateX(120%)}}
.tg-btn:active{transform:scale(.97);}

.tg-circle{width:36px;height:36px;flex-shrink:0;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;}

/* ── BOTTOM ── */
.card-img{width:58%;max-width:240px;mix-blend-mode:screen;opacity:.85;margin-top:34px;animation:floatImg 7s ease-in-out infinite;}
@keyframes floatImg{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.rb{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.rb-badge{font-size:.44rem;letter-spacing:5px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.28);}
.rb-value{font-family:'Bebas Neue',sans-serif;font-size:clamp(1rem,5.5vw,1.4rem);letter-spacing:4px;color:var(--lime);text-shadow:0 0 20px rgba(200,255,0,.5);}
</style>
</head>
<body>

<div class="bg-chips"></div>
<div class="bg-smoke"></div>
<div class="bg-vig"></div>
<div id="pts"></div>

<div class="page">

    <!-- BRAND -->
    <div class="brand">
        <div class="brand-name">YAMAL UNION</div>
        <div class="brand-sub">Покерный клуб · СНГ</div>
    </div>

    <div class="line"></div>
    <div class="union-tag">Крупнейший союз СНГ</div>

    <!-- POLL -->
    <div class="poll-card">
        <div class="poll-step">Шаг 1 из 2</div>
        <div class="poll-q">Какое у вас устройство?</div>

        <div class="poll-grid">

            <!-- iOS -->
            <button class="dev-btn" id="btn-ios" onclick="pick('ios')">
                <div class="dev-icon-wrap">
                    <svg width="32" height="32" viewBox="0 0 814 1000" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.1 134.8-316.5 267.9-316.5 70.1 0 128.4 46.4 172.5 46.4 42.8 0 109.1-49.1 190.8-49.1zM554.1 107.8c33.5-39.5 56.6-94.1 56.6-148.8 0-7.7-.6-15.4-1.9-21.8-54 2-117.6 36-155.5 78.5-33.5 37-65.3 91.7-65.3 147 0 8.4 1.3 16.7 1.9 19.3 3.9.6 10.3 1.3 16.7 1.3 48.4 0 109.7-32.5 147.5-75.5z"/>
                    </svg>
                </div>
                <div class="dev-label">iOS</div>
            </button>

            <!-- Android -->
            <button class="dev-btn" id="btn-android" onclick="pick('android')">
                <div class="dev-icon-wrap">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.18 15.64a2.18 2.18 0 0 1-2.18-2.18V9.77a2.18 2.18 0 0 1 4.36 0v3.69a2.18 2.18 0 0 1-2.18 2.18zm11.64 0a2.18 2.18 0 0 1-2.18-2.18V9.77a2.18 2.18 0 0 1 4.36 0v3.69a2.18 2.18 0 0 1-2.18 2.18zM3.82 8.68A8.18 8.18 0 0 1 12 2a8.18 8.18 0 0 1 8.18 6.68H3.82zm5.6-4.73a.55.55 0 1 0-1.1 0 .55.55 0 0 0 1.1 0zm5.15 0a.55.55 0 1 0-1.1 0 .55.55 0 0 0 1.1 0zM8.18 17.36h7.64V22a1.09 1.09 0 0 1-1.09 1.09H9.27A1.09 1.09 0 0 1 8.18 22v-4.64z"/>
                        <line x1="8.73" y1="3.95" x2="7.09" y2="1.82" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
                        <line x1="15.27" y1="3.95" x2="16.91" y2="1.82" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="dev-label">Android</div>
            </button>

        </div>
    </div>

    <!-- CTA -->
    <div class="cta-wrap" id="ctaWrap">
        <div class="cta-inner">
            <div class="cta-hint">Шаг 2 — Активация аккаунта</div>
            <a href="https://t.me/zamazka_vip_bot" class="tg-btn" target="_blank" onclick="trackLead()">
                <span class="tg-circle">
                    <!-- Telegram plane -->
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="#c8ff00">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </span>
                Перейти в Telegram для активации
            </a>
        </div>
    </div>

    <!-- CARD + RB -->
    <img src="card_only.png" class="card-img" alt="">
    <div class="rb">
        <div class="rb-badge">Условия участия</div>
        <div class="rb-value">Максимальный рейкбек</div>
    </div>

</div>

<script>
/* particles */
(function(){
    const c=document.getElementById('pts');
    for(let i=0;i<20;i++){
        const p=document.createElement('div');
        p.className='pt';
        const s=Math.random()*2.5+1;
        p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*14}s;animation-delay:${Math.random()*15}s`;
        c.appendChild(p);
    }
})();

function pick(dev){
    document.getElementById('btn-ios').classList.toggle('sel',dev==='ios');
    document.getElementById('btn-android').classList.toggle('sel',dev==='android');
    const w=document.getElementById('ctaWrap');
    w.classList.add('show');
    setTimeout(()=>{w.scrollIntoView({behavior:'smooth',block:'center'});},200);
}

function trackLead(){
    if(typeof fbq!=='undefined'){fbq('track','Lead');}
}
</script>
</body>
</html>
